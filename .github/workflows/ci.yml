name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Push to main is a post-merge canary: it re-runs the full suite against the
  # tip of main to catch a break that no PR check saw (e.g. two green PRs that
  # conflict semantically once both land). It reports a broken main; it cannot
  # prevent the commit landing -- that guarantee is branch protection requiring
  # the "make all" check.
  push:
    branches: [main]

concurrency:
  # PRs group by number so a newer push supersedes and cancels the stale run.
  # Pushes to main group by commit SHA, giving every commit its own group. A
  # constant refs/heads/main key would place all main pushes in one group,
  # where a group holds only one pending run: a newer push would evict the
  # pending run of a commit still queued behind an in-flight one, and that
  # mid-flight commit would never be validated. Per-SHA grouping is what
  # guarantees every commit on main runs; cancel-in-progress only governs PR
  # supersession (it does not protect a pending run, so it cannot carry this).
  # The group is workflow-run scoped, so a supersession cancels all jobs of the
  # stale run together.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The single "make all" job used to run lint + build + both test passes + the
# browser e2e serially, and crossed the 30-minute job timeout as the suite
# grew. The work is split into parallel jobs below; the "make all" job at the
# bottom is now an aggregation GATE (it never invokes `make all`) that keeps the
# branch-protection required check named "make all" reporting green only when
# every worker succeeds. bin/check-ci-test-jobs.ts (run by `make lint`) asserts
# every enumerated test pass runs in a job and every job is in the gate's needs.
jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      # No database: check-env gates only on bun + node_modules + hooksPath, and
      # the env files (written by the setup action) satisfy anything vite or the
      # lint sub-checks read. build-admin-ui also runs in the e2e job; the
      # duplication is intentional and keeps the two jobs independent.
      - name: Run lint, build, and admin-ui bundle
        run: make lint build build-admin-ui

  test-unit:
    name: test unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # bin/db-reset runs psql with -h/-p only (no -U), so its superuser identity
      # comes from libpq's PGUSER/PGPASSWORD here. Do not add -U to db-reset to
      # "fix" this -- that is what would break CI.
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
        with:
          database: "true"
      - name: Run the unit test pass
        run: make test-unit

  test-workflow:
    name: test workflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
        with:
          database: "true"
      - name: Run the workflow-deploy integration pass
        run: make test-workflow

  test-core:
    name: test core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
        with:
          database: "true"
      - name: Run the inference, hub-api, and db integration pass
        run: make test-core

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
        with:
          database: "true"
          playwright: "true"
      # make test-e2e builds the admin-ui bundle itself, then runs the browser
      # suite against the container Postgres (the provisioner's maintenance
      # connection runs as the postgres superuser, so it can CREATE DATABASE
      # per run and GRANT to the roles the setup action created).
      - name: Run the admin-ui browser e2e suite
        run: make test-e2e

  # The required status check. Named "make all" to match branch protection's
  # context (a job's context is its `name`). It runs no tests itself -- it gates
  # on every worker so the required check is green only when all pass. `always()`
  # forces it to report a conclusion even when a worker fails, so the required
  # context never sticks pending and blocks the PR.
  make-all:
    name: make all
    runs-on: ubuntu-latest
    needs: [static, test-unit, test-workflow, test-core, e2e]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job did not succeed (result: $result)"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
